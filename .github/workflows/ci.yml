name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Secrets go through env, not ${{ }} inside the script, so they're never
      # expanded into the shell command itself. Tests never need these; they only
      # bake the production endpoints into the release APK. Until they're set the
      # build is skipped with a warning — an APK without them can't sign in
      # (AuthConfig.isConfigured), so there'd be nothing useful to upload.
      - name: Check release config
        id: config
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          THUNDERID_ISSUER: ${{ secrets.PROD_THUNDERID_ISSUER }}
          THUNDERID_CLIENT_ID: ${{ secrets.PROD_THUNDERID_CLIENT_ID }}
        run: |
          missing=()
          for name in API_BASE_URL THUNDERID_ISSUER THUNDERID_CLIENT_ID; do
            [ -n "${!name}" ] || missing+=("PROD_${name}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping release APK — repository secrets not set: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release builds refuse to sign in over plain http (AuthConfig.usesHttps).
          for name in API_BASE_URL THUNDERID_ISSUER; do
            case "${!name}" in
              https://*) ;;
              *) echo "::error::PROD_${name} must be an https:// URL."; exit 1 ;;
            esac
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.configured == 'true'
        run: flutter pub get
      - name: Build release APK
        if: steps.config.outputs.configured == 'true'
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          THUNDERID_ISSUER: ${{ secrets.PROD_THUNDERID_ISSUER }}
          THUNDERID_CLIENT_ID: ${{ secrets.PROD_THUNDERID_CLIENT_ID }}
          THUNDERID_APPLICATION_ID: ${{ secrets.PROD_THUNDERID_APPLICATION_ID }}
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=THUNDERID_ISSUER="$THUNDERID_ISSUER" \
            --dart-define=THUNDERID_CLIENT_ID="$THUNDERID_CLIENT_ID" \
            --dart-define=THUNDERID_APPLICATION_ID="$THUNDERID_APPLICATION_ID"
      - if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coregrid-mobile-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
